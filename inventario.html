<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Inventario - App Café</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script src="js/firebase.js"></script>
</head>

<body>

  <h1>Inventario</h1>

  <button id="btnExcel">Exportar a Excel</button>

  <section>
    <h2>Agregar / Editar producto</h2>

    <form id="formInventario">
      <label>
        Código / Nombre:
        <input type="text" id="prodId" required>
      </label><br><br>

      <label>
        Cantidad (kg):
        <input type="number" id="cantidad" required>
      </label><br><br>

      <label>
        Humedad (%):
        <input type="number" id="humedad" required>
      </label><br><br>

      <label>
        Merma (%):
        <input type="number" id="merma" required>
      </label><br><br>

      <input type="hidden" id="docEditId">

      <button type="submit" id="btnGuardar">Guardar</button>
      <button type="button" id="btnCancelarEdicion" style="display:none;">Cancelar edición</button>
    </form>
  </section>

  <hr>

  <section>
    <h2>Listado de inventario</h2>
    <div id="inventario-list"></div>
  </section>

  <script src="js/inventario.js"></script>
  <script src="js/menu.js"></script>

</body>
</html>
