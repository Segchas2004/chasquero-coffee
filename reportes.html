<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reportes - App Café</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script src="js/firebase.js"></script>
</head>

<body>

  <h1>Reportes Avanzados</h1>

  <section>
    <h2>Filtros por fecha (lotes)</h2>
    <label>
      Desde:
      <input type="date" id="fDesde">
    </label>
    <label>
      Hasta:
      <input type="date" id="fHasta">
    </label>
    <button id="btnFiltrar">Aplicar filtro</button>
    <button id="btnLimpiar">Quitar filtro</button>
    <button id="btnPDF">Exportar a PDF</button>
  </section>

  <hr>

  <h2>Peso total por lote (barras)</h2>
  <canvas id="chartPeso"></canvas>

  <h2>Humedad por lote (línea)</h2>
  <canvas id="chartHumedad"></canvas>

  <h2>Comparativo Inventario vs Lotes (peso total)</h2>
  <canvas id="chartComparativo"></canvas>

  <h2>Merma y humedad crítica</h2>
  <div id="resumenCritico"></div>

  <script src="js/reportes.js"></script>
  <script src="js/menu.js"></script>

</body>
</html>
